name: reloj
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Despertar al Baul movil
        env:
          SEC: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -m 90 -H "Authorization: Bearer $SEC" https://baul-movil.vercel.app/api/cron/programados
